<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up – Comeunite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="page">
  <header class="nav">
    <a class="logo" href="index.html" aria-label="Comeunite home">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20V8a4 4 0 0 1 4-4h8"/><path d="M6 12h10"/></svg>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-light">Back to home</a>
      <a href="become-a-member.html" class="btn btn-dark">Become a member</a>
    </div>
  </header>

  <main class="main">
    <section class="card" aria-labelledby="title">
      <div class="tabs" role="tablist" aria-label="Account">
        <button class="tab" role="tab" id="tab-signup" aria-selected="true" aria-controls="panel">Sign up</button>
        <button class="tab" role="tab" id="tab-signin" aria-selected="false" aria-controls="panel" tabindex="-1">Sign in</button>
      </div>

      <div id="panel" role="tabpanel">
        <h1 id="title">Create your account</h1>
        <p class="lead" id="lead">Join the private community of top tech investors.</p>

        <form id="authForm" novalidate>
          <button type="button" class="btn-social" id="googleBtn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.17a5.28 5.28 0 0 1-2.29 3.46v2.87h3.7c2.17-2 3.42-4.94 3.42-8.52z"/><path fill="#34A853" d="M12 24c3.1 0 5.7-1.03 7.6-2.79l-3.7-2.87c-1.03.69-2.35 1.1-3.9 1.1-3 0-5.54-2.02-6.45-4.74H1.74v2.97A11.5 11.5 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.55 14.7a6.9 6.9 0 0 1 0-4.4V7.33H1.74a11.5 11.5 0 0 0 0 10.34l3.81-2.97z"/><path fill="#EA4335" d="M12 4.76c1.69 0 3.2.58 4.39 1.72l3.28-3.28C17.7 1.35 15.1.25 12 .25 7.5.25 3.6 2.84 1.74 7.33l3.81 2.97C6.46 7.78 9 4.76 12 4.76z"/></svg>
            Continue with Google
          </button>
          <div class="divider">or with email</div>

          <div class="field" id="f-name">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Anna Schmidt">
            <span class="error-msg">Enter your full name.</span>
          </div>

          <div class="field" id="f-email">
            <label for="email">Work email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com">
            <span class="error-msg">Enter a valid email address.</span>
          </div>

          <div class="field" id="f-password">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
            </div>
            <span class="error-msg">Use at least 8 characters.</span>
          </div>

          <label class="check" id="termsRow">
            <input type="checkbox" id="terms">
            <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</span>
          </label>

          <div class="form-msg" id="msg" role="status"></div>
          <button type="submit" class="btn btn-dark btn-block" id="submitBtn">Create account</button>
        </form>

        <p class="foot" id="foot">Already a member? <a href="#" id="switchLink">Sign in</a></p>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  var mode = 'signup';
  var $ = function (id) { return document.getElementById(id); };
  var form = $('authForm'), msg = $('msg');

  var copy = {
    signup: { title: 'Create your account', lead: 'Join the private community of top tech investors.', btn: 'Create account', foot: 'Already a member? <a href="#" id="switchLink">Sign in</a>', pw: 'new-password' },
    signin: { title: 'Welcome back', lead: 'Sign in to your Comeunite account.', btn: 'Sign in', foot: 'New here? <a href="#" id="switchLink">Create an account</a>', pw: 'current-password' }
  };

  function setMode(m) {
    mode = m;
    var c = copy[m];
    $('title').textContent = c.title;
    $('lead').textContent = c.lead;
    $('submitBtn').textContent = c.btn;
    $('foot').innerHTML = c.foot;
    $('password').setAttribute('autocomplete', c.pw);
    $('f-name').style.display = m === 'signup' ? '' : 'none';
    $('termsRow').style.display = m === 'signup' ? '' : 'none';
    $('tab-signup').setAttribute('aria-selected', m === 'signup');
    $('tab-signin').setAttribute('aria-selected', m === 'signin');
    $('tab-signup').tabIndex = m === 'signup' ? 0 : -1;
    $('tab-signin').tabIndex = m === 'signin' ? 0 : -1;
    msg.className = 'form-msg';
    document.querySelectorAll('.field').forEach(function (f) { f.classList.remove('invalid'); });
    document.title = (m === 'signup' ? 'Sign up' : 'Sign in') + ' – Comeunite';
    bindSwitch();
  }
  function bindSwitch() {
    var l = $('switchLink');
    if (l) l.addEventListener('click', function (e) { e.preventDefault(); setMode(mode === 'signup' ? 'signin' : 'signup'); });
  }

  $('tab-signup').addEventListener('click', function () { setMode('signup'); });
  $('tab-signin').addEventListener('click', function () { setMode('signin'); });
  if (location.hash === '#signin') setMode('signin'); else setMode('signup');

  $('pwToggle').addEventListener('click', function () {
    var p = $('password'), show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    this.textContent = show ? 'Hide' : 'Show';
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  function flag(id, bad) { $(id).classList.toggle('invalid', bad); return !bad; }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.className = 'form-msg';
    var ok = true;
    if (mode === 'signup') ok = flag('f-name', $('name').value.trim().length < 2) && ok;
    ok = flag('f-email', !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('email').value.trim())) && ok;
    ok = flag('f-password', $('password').value.length < 8) && ok;
    if (mode === 'signup' && !$('terms').checked) {
      msg.textContent = 'Please accept the Terms and Privacy Policy to continue.';
      msg.className = 'form-msg show err';
      ok = false;
    }
    if (!ok) return;

    var btn = $('submitBtn');
    btn.disabled = true;
    btn.textContent = mode === 'signup' ? 'Creating account…' : 'Signing in…';

    // TODO: replace with a real request, e.g. fetch('/api/signup', { method: 'POST', body: ... })
    setTimeout(function () {
      btn.disabled = false;
      btn.textContent = copy[mode].btn;
      msg.textContent = mode === 'signup'
        ? 'Account created. Complete your membership application next.'
        : 'Signed in successfully.';
      msg.className = 'form-msg show ok';
      if (mode === 'signup') setTimeout(function () { location.href = 'become-a-member.html'; }, 1200);
    }, 800);
  });

  $('googleBtn').addEventListener('click', function () {
    // TODO: connect your Google OAuth flow here
    msg.textContent = 'Google sign-in is not connected yet.';
    msg.className = 'form-msg show err';
  });
})();
</script>
</body>
</html>
